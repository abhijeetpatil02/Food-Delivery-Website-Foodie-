<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Foodie Login Page</title>
    <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#d71920">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f6f9fc, #e2f0cb);
      background-image: url('login.avif'); /* ✅ Correct image file name */
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.2); /* Frosted glass */
      backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      width: 360px;
      text-align: center;
      animation: fadeInUp 1s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      margin-bottom: 25px;
      color: #ffffff;
      font-size: 28px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: #f1f1f1;
      font-weight: 500;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 16px;
      background-color: rgba(255, 255, 255, 0.7);
      color: #333;
    }

    .input-group input:focus {
      border-color: #27ae60;
      outline: none;
    }

    #button-group button {
      width: 100%;
      padding: 12px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
    }

    #button-group button:hover {
      background-color: #2ecc71;
      transform: translateY(-2px);
    }

    a {
      text-decoration: none;
      color: #030301;
      font-weight: 500;
    }

    a:hover {
      text-decoration: underline;
    }

    p {
      color: white;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>🍕 Foodie Login</h1>
    <form action="/login" method="POST">
      <div class="input-group">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" placeholder="Enter your username" required>
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" placeholder="Enter your password"  required>
      </div>
      <div id="button-group">
        <button type="submit" class="login" id="loginBtn">Login</button>
      </div>
      <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
    </form>
  </div>
  <!-- js -->
   <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js")
        .then(() => console.log("Service Worker Registered"))
        .catch(err => console.log("SW Error", err));
    }
  </script>
</body>
</html>
