<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie - Menu</title>

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#e23744">

    <!-- Shared Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>

    <style>
        body {
            background-color: var(--bg-base);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* Top navigation header */
        .top-nav {
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-title);
            font-weight: 700;
            color: var(--primary);
            font-size: 0.95rem;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            background: var(--primary-glow);
            transition: var(--transition-smooth);
        }

        .back-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateX(-3px);
        }

        .brand-name {
            font-family: var(--font-title);
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .brand-name span {
            color: var(--primary);
        }

        /* Page header section */
        .page-header {
            text-align: center;
            margin: 50px 0 30px 0;
            padding: 0 20px;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Grid container */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 35px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 5%;
        }

        .box {
            background-color: var(--bg-surface-solid);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: var(--transition-bounce);
            position: relative;
            display: flex;
            flex-direction: column;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .box:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(226, 55, 68, 0.15);
        }

        .box a {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .img-container {
            width: 100%;
            height: 190px;
            overflow: hidden;
            position: relative;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition-smooth);
        }

        .box:hover img {
            transform: scale(1.05);
        }

        /* Food Type badge (Veg / Non-veg dot) */
        .food-indicator {
            position: absolute;
            top: 15px;
            left: 15px;
            background: white;
            padding: 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        }

        .food-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .food-dot.veg {
            background-color: var(--success);
            border: 1px solid var(--success-light);
        }

        .food-dot.nonveg {
            background-color: var(--danger);
            border: 1px solid #ff4d4d;
        }

        .food-details {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .box h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 5px;
            line-height: 1.3;
        }

        .item-rating {
            color: var(--secondary);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 10px;
        }

        .price-row h3 {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--primary-dark);
            margin: 0;
        }

        /* Ordering button */
        .box button {
            height: 40px;
            padding: 0 16px;
            background-color: var(--success);
            color: white;
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.2);
            transition: var(--transition-bounce);
        }

        .box:hover button {
            background-color: var(--success-light);
            box-shadow: 0 6px 15px rgba(39, 174, 96, 0.45);
            transform: scale(1.05);
        }
    </style>
</head>



<body>
    <div class="top-nav">
        <a id="back-link" href="restaurants.html" class="back-btn">← Back to Restaurants</a>
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="theme-toggle-btn" aria-label="Toggle Theme">🌙</button>
            <div class="brand-name">Foodie<span>.</span></div>
        </div>
    </div>

    <div class="page-header">
        <h1 id="page-title">Menu</h1>
        <p>Explore hot delicacies and select to place an order</p>
    </div>

    <div class="container" id="menu-container">
        <!-- Menu items will be loaded here dynamically -->
    </div>

    <!-- Include our data file -->
    <script src="data.js"></script>
    <script>
        // Get the category from the URL e.g., ?category=veg
        const urlParams = new URLSearchParams(window.location.search);
        const category = urlParams.get('category') || 'fastfood';

        // Update back navigation URL to remember category
        document.getElementById('back-link').href = `restaurants.html?category=${category}`;

        // Load data for the category
        const currentData = restaurantData[category];

        if (currentData) {
            document.getElementById('page-title').innerText = currentData.title.replace("Restaurants", "Menu");

            const container = document.getElementById('menu-container');

            currentData.menu.forEach((item, index) => {
                const box = document.createElement('div');
                box.className = 'box';
                box.style.animationDelay = `${index * 0.08}s`;

                const orderLink = `order.html?item=${encodeURIComponent(item.name)}&price=${item.price}&image=${encodeURIComponent(item.image)}`;

                // Veg/nonveg dot helper
                const isVeg = category === 'veg' || (category === 'fastfood' && !['Burger', 'HotDog', 'Noodles', 'Pizza', 'Momos', 'Sandwich'].includes(item.name));
                const foodDotClass = isVeg ? 'veg' : 'nonveg';

                // Random mock ratings for visual details
                const mockRating = (4.4 + (index % 5) * 0.1).toFixed(1);
                const mockCount = 50 + (index % 10) * 15;

                box.innerHTML = `
                    <a href="${orderLink}">
                        <div class="img-container">
                            <img src="${item.image}" alt="${item.name}">
                            <div class="food-indicator">
                                <div class="food-dot ${foodDotClass}"></div>
                            </div>
                        </div>
                        <div class="food-details">
                            <h2>${item.name}</h2>
                            <div class="item-rating">⭐ ${mockRating} <span>(${mockCount}+ orders)</span></div>
                            <div class="price-row">
                                <h3>₹${item.price}</h3>
                                <button>Order</button>
                            </div>
                        </div>
                    </a>
                `;
                container.appendChild(box);
            });
        } else {
            document.getElementById('page-title').innerText = "Menu Not Found";
        }
    </script>
</body>

</html>
