<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foodie - Place Your Order</title>
  
  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#e23744">

  <!-- Shared & Page Styles -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="order.css">
  <script src="theme.js"></script>
</head>
<body>

  <header>
    <div style="width: 100%; max-width: 1000px; display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 10px;">🍱 Foodie - Checkout</div>
      <button class="theme-toggle-btn" aria-label="Toggle Theme">🌙</button>
    </div>
  </header>

  <div class="checkout-container">
    <!-- Stepper progress bar -->
    <div class="stepper">
      <div class="step completed">
        <div class="step-icon">✓</div>
        <div class="step-label">Select Meal</div>
      </div>
      <div class="step active">
        <div class="step-icon">2</div>
        <div class="step-label">Delivery Address</div>
      </div>
      <div class="step">
        <div class="step-icon">3</div>
        <div class="step-label">Payment Method</div>
      </div>
      <div class="step">
        <div class="step-icon">4</div>
        <div class="step-label">Order Placed</div>
      </div>
    </div>

    <!-- Main Checkout Forms Grid -->
    <div class="content-grid">
      <!-- Order details receipt-card -->
      <div class="menu-summary-card">
        <h2>Order Details</h2>
        <div class="food-preview-box">
          <img id="order-image" src="" alt="Food Item">
          
          <div class="receipt-row">
            <span class="label">Ordered Item</span>
            <span id="order-item" class="val">-</span>
          </div>
          <div class="receipt-row">
            <span class="label">Price</span>
            <span id="order-price" class="val">₹0</span>
          </div>
          <div class="receipt-row">
            <span class="label">Delivery Fee</span>
            <span class="val" style="color: var(--success); font-weight: 700;">FREE</span>
          </div>
          <div class="receipt-row">
            <span class="label">Total Amount</span>
            <span id="order-total" class="val">₹0</span>
          </div>
        </div>
      </div>
      
      <!-- Delivery details card -->
      <div class="delivery-card">
        <h2>Delivery Info</h2>
        <form action="orders" method="POST">
          <!-- Hidden Inputs for Item Details -->
          <input type="hidden" id="hidden-item" name="item_name">
          <input type="hidden" id="hidden-price" name="price">
          <input type="hidden" id="hidden-image" name="image_url">

          <div class="form-input-wrapper">
            <label for="phone">📞 Phone Number</label>
            <input type="tel" id="phone" name="phone" pattern="^\d{10}$" maxlength="10" placeholder="Enter 10-digit mobile number" required>
          </div>

          <div class="form-input-wrapper">
            <label for="address">🏠 Delivery Address</label>
            <textarea id="address" name="address" rows="3" placeholder="Enter full home/office address details" required></textarea>
          </div>

          <button type="submit" class="checkout-btn">Confirm & Next</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    function getQueryParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        item: params.get('item'),
        price: params.get('price'),
        image: params.get('image')
      };
    }

    window.onload = function () {
      const { item, price, image } = getQueryParams();

      if (item && price && image) {
        document.getElementById('order-item').textContent = item;
        document.getElementById('order-price').textContent = `₹${price}`;
        document.getElementById('order-total').textContent = `₹${price}`;
        document.getElementById('order-image').src = image;
        document.getElementById('order-image').alt = item;
        
        document.getElementById('hidden-item').value = item;
        document.getElementById('hidden-price').value = price;
        document.getElementById('hidden-image').value = image;
      }
    };
  </script>
</body>
</html>
