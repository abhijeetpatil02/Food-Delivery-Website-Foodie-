<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Foodie - Login & Sign Up</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#e23744">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    body {
      background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.65)), url('login.avif') no-repeat center center/cover;
      background-color: var(--bg-dark); /* fallback */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-lg);
      padding: 40px 35px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 400px;
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .brand-logo-container {
      margin-bottom: 25px;
    }

    .brand-logo {
      font-size: 2.2rem;
      font-family: var(--font-title);
      font-weight: 800;
      color: var(--text-white);
      letter-spacing: -0.5px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo span {
      color: var(--secondary);
    }

    /* Override input colors for dark backdrop */
    .auth-container .input-group-modern label {
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
    }

    .auth-container .input-modern {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-white);
      transition: var(--transition-smooth);
    }

    .auth-container .input-modern::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .auth-container .input-modern:focus {
      background: rgba(255, 255, 255, 0.18);
      border-color: var(--secondary);
      box-shadow: 0 0 0 4px rgba(246, 174, 45, 0.2);
    }

    .auth-btn-custom {
      width: 100%;
      margin-top: 10px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      color: var(--text-white);
      padding: 14px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(226, 55, 68, 0.35);
      transition: var(--transition-bounce);
    }

    .auth-btn-custom:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(226, 55, 68, 0.5);
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
    }

    p.auth-switch {
      color: rgba(255, 255, 255, 0.7);
      margin-top: 25px;
      font-size: 0.95rem;
    }

    p.auth-switch a {
      color: var(--secondary);
      font-weight: 600;
      cursor: pointer;
      border-bottom: 1.5px dashed rgba(246, 174, 45, 0.4);
      padding-bottom: 2px;
      margin-left: 4px;
      transition: var(--transition-smooth);
    }

    p.auth-switch a:hover {
      color: var(--text-white);
      border-bottom-color: var(--text-white);
    }

    .form-wrapper {
      display: none;
    }

    .form-wrapper.active {
      display: block;
      animation: fadeIn 0.5s ease forwards;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="brand-logo-container">
      <div class="brand-logo">🍕 Foodie<span>.</span></div>
    </div>
    
    <!-- Login Form -->
    <div id="loginForm" class="form-wrapper active">
      <form action="/login" method="POST">
        <div class="input-group-modern">
          <label for="login-username">Username</label>
          <input id="login-username" class="input-modern" type="text" name="username" placeholder="Enter your username" required autocomplete="username">
        </div>
        <div class="input-group-modern">
          <label for="login-password">Password</label>
          <input id="login-password" class="input-modern" type="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <button type="submit" class="auth-btn-custom">Login to Account</button>
        <p class="auth-switch">Don't have an account? <a onclick="toggleForm('signup')">Sign Up</a></p>
      </form>
    </div>

    <!-- Signup Form -->
    <div id="signupForm" class="form-wrapper">
      <form action="/handleform" method="POST">
        <div class="input-group-modern">
          <label for="signup-username">Username</label>
          <input type="text" id="signup-username" class="input-modern" name="username" required placeholder="Choose a username" autocomplete="username">
        </div>
        <div class="input-group-modern">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" class="input-modern" name="email" required placeholder="Enter your email" autocomplete="email">
        </div>
        <div class="input-group-modern">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" class="input-modern" name="password" required placeholder="Create a password" autocomplete="new-password">
        </div>
        <button type="submit" class="auth-btn-custom">Create Account</button>
        <p class="auth-switch">Already have an account? <a onclick="toggleForm('login')">Login</a></p>
      </form>
    </div>
  </div>

  <script>
    function toggleForm(formType) {
      document.getElementById('loginForm').classList.remove('active');
      document.getElementById('signupForm').classList.remove('active');
      if (formType === 'signup') {
        document.getElementById('signupForm').classList.add('active');
      } else {
        document.getElementById('loginForm').classList.add('active');
      }
    }
  </script>
</body>
</html>
