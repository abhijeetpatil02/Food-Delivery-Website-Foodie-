<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Foodie Authentication</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#d71920">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f6f9fc, #e2f0cb);
      background-image: url('login.avif');
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .auth-container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      width: 360px;
      text-align: center;
      animation: fadeInUp 1s ease;
      position: relative;
      overflow: hidden;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 { margin-bottom: 25px; color: #ffffff; font-size: 28px; }
    .input-group { margin-bottom: 20px; text-align: left; }
    .input-group label { display: block; margin-bottom: 6px; color: #f1f1f1; font-weight: 500; }
    .input-group input {
      width: 100%; padding: 12px; border: 1px solid #ccc;
      border-radius: 12px; font-size: 16px;
      background-color: rgba(255, 255, 255, 0.8); color: #333;
    }
    .input-group input:focus { border-color: #27ae60; outline: none; background: #ffffff;}
    button.auth-btn {
      width: 100%; padding: 12px; background-color: #27ae60;
      color: white; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 600; cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
    }
    button.auth-btn:hover { background-color: #2ecc71; transform: translateY(-2px); }
    p { color: white; margin-top: 15px;}
    a { text-decoration: none; color: #030301; font-weight: 600; cursor: pointer; }
    a:hover { text-decoration: underline; }
    
    .form-wrapper { display: none; }
    .form-wrapper.active { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="auth-container">
    <h1>🍕 Foodie</h1>
    
    <!-- Login Form -->
    <div id="loginForm" class="form-wrapper active">
      <form action="/login" method="POST">
        <div class="input-group">
          <label for="login-username">Username</label>
          <input id="login-username" type="text" name="username" placeholder="Enter your username" required>
        </div>
        <div class="input-group">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" name="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="auth-btn">Login</button>
        <p>Don't have an account? <a onclick="toggleForm('signup')">Sign Up</a></p>
      </form>
    </div>

    <!-- Signup Form -->
    <div id="signupForm" class="form-wrapper">
      <form action="/handleform" method="POST">
        <div class="input-group">
          <label for="signup-username">Username</label>
          <input type="text" id="signup-username" name="username" required placeholder="Choose a username">
        </div>
        <div class="input-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" name="email" required placeholder="Enter your email">
        </div>
        <div class="input-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" name="password" required placeholder="Create a password">
        </div>
        <button type="submit" class="auth-btn">Sign Up</button>
        <p>Already have an Account? <a onclick="toggleForm('login')">Login</a></p>
      </form>
    </div>
  </div>

  <script>
    function toggleForm(formType) {
      document.getElementById('loginForm').classList.remove('active');
      document.getElementById('signupForm').classList.remove('active');
      if (formType === 'signup') {
        document.getElementById('signupForm').classList.add('active');
      } else {
        document.getElementById('loginForm').classList.add('active');
      }
    }
  </script>
</body>
</html>
